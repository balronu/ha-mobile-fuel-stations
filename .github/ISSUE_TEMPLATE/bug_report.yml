name: Bug report
description: Report a reproducible integration problem
body:
  - type: input
    id: integration_version
    attributes:
      label: Integration version
    validations: {required: true}
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations: {required: true}
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options: [HACS, Manual]
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics and logs
      description: Never post API keys or exact private coordinates.
