name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
        python-version: "3.14.2"
      - run: python -m pip install --upgrade pip pytest pytest-asyncio pytest-homeassistant-custom-component aiohttp homeassistant==2026.10.1
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- custom_components/mobile_fuel_stations/frontend/mobile-fuel-stations-card.js
      - run: git diff --check
