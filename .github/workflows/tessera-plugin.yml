name: Tessera plugin contract
on:
  pull_request:
    paths:
      - 'tessera-plugin/**'
      - '.github/workflows/tessera-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tessera-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Fetch official Tessera plugin validation
        run: |
          git clone --depth 1 https://github.com/MaxGramser/tessera-plugins.git /tmp/tessera-plugins
      - name: Validate plugin against Tessera's official checker
        run: |
          set -o pipefail
          python /tmp/tessera-plugins/tools/check.py "$GITHUB_WORKSPACE/tessera-plugin" 2>&1 | tee tessera-check.log
      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-validator-log
          path: tessera-check.log
          if-no-files-found: ignore
      - name: Parse local YAML and translation JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml
          p = Path("tessera-plugin")
          manifest = yaml.safe_load((p / "tessera-plugin.yaml").read_text())
          assert manifest["id"] == "mobile_fuel_stations"
          assert len(manifest["tiles"][0]["fields"]) == 8
          assert manifest["tiles"][0]["sizes"] == {"min": "1x1", "max": "4x4"}
          assert "cheapest_stations_by_fuel" in manifest["tiles"][0]["has_attributes"]
          assert "fuel_types" in manifest["tiles"][0]["attributes"]
          assert any(card["id"] == "stations" for card in manifest["cards"])
          for language in ("de", "en"):
              data = json.loads((p / "translations" / f"{language}.json").read_text())
              assert data["app"]["name"] and data["app"]["summary"]
              for key in ("details", "fuel", "open", "closed", "status_unknown", "no_address", "tap_to_switch"):
                  assert data["screen"][key]
              assert data["app"]["card_stations"]
          preview = yaml.safe_load((p / "preview.yaml").read_text())
          assert "sensor.mobile_fuel_stations_overview" in preview["states"]
          assert "sensor.mobile_fuel_stations_empty" in preview["states"]
          assert "sensor.mobile_fuel_stations_stale" in preview["states"]
          assert preview["states"]["sensor.mobile_fuel_stations_overview"]["attributes"]["fuel_types"]
          print("YAML and translations parsed")
          PY

  tessera-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host preview dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev build-essential pkg-config
      - name: Fetch upstream Tessera plugin bench
        run: |
          git clone --depth 1 https://github.com/MaxGramser/tessera-plugins.git /tmp/tessera-plugins
      - name: Prepare Tessera host bench
        env:
          TESSERA_REF: dev
        run: python /tmp/tessera-plugins/tools/preview.py --setup
      - name: Work around ESPHome 2026.9 host-output scaling regression
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = list(Path('/tmp/tessera-plugins/tools/.cache').glob('tessera-*/tools/render/host.py'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one Tessera host source, found: {candidates}')
          path = candidates[0]
          source = path.read_text()
          old = '    type: float\\n    write_action:'
          new = '    type: float\\n    min_power: 0%\\n    write_action:'
          if source.count(old) != 1:
              raise SystemExit('Host template output shape changed; refuse to patch')
          path.write_text(source.replace(old, new, 1))
          print('Host-only template outputs now request ESPHome float power scaling')
          PY
      - name: Compile and render Tessera plugin preview
        env:
          TESSERA_REF: dev
        run: |
          set -o pipefail
          python /tmp/tessera-plugins/tools/preview.py "$GITHUB_WORKSPACE/tessera-plugin" --board guition --strict 2>&1 | tee tessera-preview.log
      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-preview
          path: |
            tessera-plugin/.preview/
            tessera-preview.log
          if-no-files-found: warn
          include-hidden-files: true
