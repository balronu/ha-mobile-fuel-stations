id: mobile_fuel_stations
version: 0.1.0
api: "0.24"
icon: gas-station
maintainer: balronu
license: MIT
stage: beta
topics: [travel]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

tiles:
  - id: highlights
    name: tile_highlights
    icon: gas-station
    sizes: { min: 2x2, max: 3x2 }
    memory: 1400
    domains: [sensor]
    has_attributes: [nearest_station, cheapest_station]
    attributes: [data_stale, station_count]
    fields:
      nearest_name: nearest_station.station_name
      nearest_price: { path: nearest_station.price, as: number }
      nearest_distance: { path: nearest_station.distance, as: number }
      nearest_currency: nearest_station.currency
      cheapest_name: cheapest_station.station_name
      cheapest_price: { path: cheapest_station.price, as: number }
      cheapest_distance: { path: cheapest_station.distance, as: number }
      cheapest_currency: cheapest_station.currency
    example: highlights_example
