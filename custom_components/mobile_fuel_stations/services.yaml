probe_nakordoni:
  name: Probe Nakordoni
  description: Run one administrator-only, non-mutating Nakordoni diagnostic request.
  target: {}
  # The service targets a config entry through the explicit field below.
  # Home Assistant's service-description schema requires a target block even
  # for integrations whose action target is not an entity/device/area.
  fields:
    entry_id:
      name: Config entry
      description: The Mobile Fuel Stations config-entry ID containing Nakordoni credentials.
      required: true
      selector:
        text:
    latitude:
      name: Latitude
      description: Probe latitude in WGS84 degrees.
      required: true
      selector:
        number:
          min: -90
          max: 90
    longitude:
      name: Longitude
      description: Probe longitude in WGS84 degrees.
      required: true
      selector:
        number:
          min: -180
          max: 180
    radius_km:
      name: Radius
      description: Search radius in kilometres, maximum 25.
      required: true
      selector:
        number:
          min: 0.001
          max: 25
          step: 0.1
    fuel_type:
      name: Fuel type
      description: Verified Nakordoni fuel key.
      required: true
      selector:
        select:
          options:
            - diesel
            - e5
            - e10
            - lpg
    station_count:
      name: Station count
      description: Maximum stations requested in this single API call.
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 20
          mode: box
manual_refresh:
  name: Refresh stations now
  description: Perform one administrator-requested station refresh for one config entry. Provider cooldowns and rate limits still apply.
  fields:
    entry_id:
      name: Config entry
      description: The Mobile Fuel Stations config-entry ID to refresh.
      required: true
      selector:
        text:
set_fetch_mode:
  name: Set station fetch mode
  description: Change one config entry between automatic and manual station fetching. This does not trigger an immediate provider request.
  fields:
    entry_id:
      name: Config entry
      description: The Mobile Fuel Stations config-entry ID to change.
      required: true
      selector:
        text:
    fetch_mode:
      name: Fetch mode
      required: true
      selector:
        select:
          options:
            - automatic
            - manual
